{{- if .Values.postgresql.enabled }}
{{- /* Hand-rolled single-node PostGIS for dev/staging. The postgis/postgis
       image auto-creates the postgis extension in POSTGRES_DB. */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rapidpro.fullname" . }}-postgresql
  labels:
    {{- include "rapidpro.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: {{ .Values.postgresql.service.type | default "ClusterIP" }}
  ports:
    - { name: postgresql, port: {{ .Values.postgresql.service.port | default 5432 }}, targetPort: postgresql }
  selector:
    {{- include "rapidpro.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rapidpro.fullname" . }}-postgresql
  labels:
    {{- include "rapidpro.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "rapidpro.fullname" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "rapidpro.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "rapidpro.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          ports:
            - { name: postgresql, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: {{ .Values.postgresql.auth.username | quote }} }
            - { name: POSTGRES_PASSWORD, value: {{ .Values.postgresql.auth.password | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.postgresql.auth.database | quote }} }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U {{ .Values.postgresql.auth.username }} -d {{ .Values.postgresql.auth.database }}"] }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  {{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgresql.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size | default "20Gi" }}
  {{- else }}
      volumes:
        - { name: data, emptyDir: {} }
  {{- end }}
{{- end }}
