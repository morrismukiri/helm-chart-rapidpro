# Default values for the RapidPro v9 chart.
# Prod points the deps at external URLs (*.enabled=false); local/staging use the
# hand-rolled single-replica deps below. Images default to docker.io/morrismukiri/*.

# Baseline replicas for workloads whose autoscaling is disabled.
replicaCount: 1

# ---------------------------------------------------------------------------
# Shared configuration (rendered into the app ConfigMap/Secret)
# ---------------------------------------------------------------------------
rapidproDomain: "rapidpro.local"
# Optional explicit CSRF trusted origins (semicolon-separated, scheme-qualified).
# Empty => the app derives https://<host> + http://<host> from ALLOWED_HOSTS.
csrfTrustedOrigins: ""

# Object storage (S3 / S3-compatible). awsS3Endpoint lets you target MinIO.
awsAccessKeyId: ""
awsSecretAccessKey: ""
awsStorageBucketName: ""
awsS3RegionName: ""
awsS3Endpoint: ""
awsMedia: "True"

smtp:
  host: "smtp.example.org"
  port: 25
  username: ""
  password: ""
  defaultFromEmail: ""
  useTls: "on"
  sendEmails: "off"

# Container securityContext for the Python workloads (we control write paths).
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# Relaxed context for the prebuilt Go binaries (run as their own non-root image
# user; local write needs are not fully known, so no read-only root FS).
goSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  annotations: {}
  name: ""

# ---------------------------------------------------------------------------
# RapidPro Django app (gunicorn) — stateless Deployment
# ---------------------------------------------------------------------------
rapidpro:
  image:
    repository: docker.io/morrismukiri/rapidpro
    pullPolicy: IfNotPresent
    tag: ""            # defaults to .Chart.AppVersion (v9.0.0)
  imagePullSecrets: []
  secretKey: ""
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
    hosts:
      - host: rapidpro.local
    tls: []
  # gunicorn tuning (env-driven; no rebuild needed to change)
  gunicorn:
    workers: 4
    threads: 4
    timeout: 30
    maxRequests: 1000
    maxRequestsJitter: 100
  # One-time setup is owned by the migrate hook Job + baked static, so these are off.
  runCollectstatic: "off"
  runCompress: "off"
  runMigrations: "off"
  initDb: "off"
  clearCompressorCache: "off"
  migrateJob:
    backoffLimit: 6
    activeDeadlineSeconds: 3600
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 3Gi }
  autoscaling:
    enabled: true
    minReplicas: 4
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 1
  podSecurityContext:
    fsGroup: 1000
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnvVars: {}
  extraEnvSecrets: {}

# ---------------------------------------------------------------------------
# Celery — a singleton beat + a list of independently-scaled worker pools.
# Queue isolation: the app image routes exports to the `exports` queue, so a
# long export never blocks light/priority tasks on the default `celery` queue.
# ---------------------------------------------------------------------------
celery:
  beat:
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 512Mi }
    nodeSelector: {}
    tolerations: []
    affinity: {}
  workers:
    - name: default
      queues: "celery"
      concurrency: 4
      autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 10, targetCPUUtilizationPercentage: 70, targetMemoryUtilizationPercentage: 75 }
      resources:
        requests: { cpu: 500m, memory: 1Gi }
        limits: { memory: 2Gi }
      pdb: { enabled: true, minAvailable: 1 }
      keda: { enabled: false }
    - name: exports
      queues: "exports"
      concurrency: 2
      autoscaling: { enabled: true, minReplicas: 1, maxReplicas: 6, targetCPUUtilizationPercentage: 70 }
      resources:
        requests: { cpu: 500m, memory: 1Gi }
        limits: { memory: 4Gi }
      pdb: { enabled: false }
      # KEDA queue-depth scaling (Redis list length). Off by default; chart-only to enable.
      keda: { enabled: false, listName: "exports", listLength: 5 }

# ---------------------------------------------------------------------------
# Mailroom (Go) — Deployment
# ---------------------------------------------------------------------------
mailroom:
  image:
    repository: docker.io/morrismukiri/mailroom
    pullPolicy: IfNotPresent
    tag: "v9.3.72"
  imagePullSecrets: []
  authToken: ""
  listenAddress: "0.0.0.0"
  redisUrl: ""        # empty => derived from the bundled broker (db 11)
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  pdb: { enabled: true, minAvailable: 1 }
  podSecurityContext: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnvVars: {}
  extraEnvSecrets: {}

# ---------------------------------------------------------------------------
# Courier (Go) — Deployment
# ---------------------------------------------------------------------------
courier:
  image:
    repository: docker.io/morrismukiri/courier
    pullPolicy: IfNotPresent
    tag: "v9.3.44"
  imagePullSecrets: []
  redisUrl: ""        # empty => derived from the bundled broker (db 12)
  service:
    type: ClusterIP
    port: 8080
  spoolDirectory: "/var/spool/courier"
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 1Gi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb: { enabled: true, minAvailable: 1 }
  podSecurityContext: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnvVars: {}
  extraEnvSecrets: {}

# ---------------------------------------------------------------------------
# rp-indexer (Go) — Deployment (indexes contacts to Elasticsearch)
# ---------------------------------------------------------------------------
indexer:
  image:
    repository: docker.io/morrismukiri/rp-indexer
    pullPolicy: IfNotPresent
    tag: "v9.3.4"
  imagePullSecrets: []
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 256Mi }
  podSecurityContext: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnvVars: {}
  extraEnvSecrets: {}

# ---------------------------------------------------------------------------
# rp-archiver (Go) — Deployment. Requires S3; enable once a bucket is set.
# ---------------------------------------------------------------------------
archiver:
  enabled: false
  image:
    repository: docker.io/morrismukiri/rp-archiver
    pullPolicy: IfNotPresent
    tag: "v9.3.9"
  imagePullSecrets: []
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
  extraEnvVars:
    ARCHIVER_TEMP_DIR: "/tmp"
    ARCHIVER_DELETE: "false"
  podSecurityContext: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnvSecrets: {}

# ---------------------------------------------------------------------------
# Dependencies. Prod: set *.enabled=false and supply external* URLs.
# local/staging: enabled=true uses the hand-rolled single-replica deps below.
# ---------------------------------------------------------------------------
externalPostgresqlUrl: ""
externalPostgresqlReadonlyUrl: ""     # optional read replica; empty => primary
externalRedisUrl: ""
externalElasticsearchUrl: ""

# Broker/cache (redis OR valkey, same wire protocol). engine selects the image.
broker:
  engine: redis            # redis | valkey
  redisRepository: redis
  redisTag: "7.2-alpine"
  valkeyRepository: valkey/valkey
  valkeyTag: "8.1-alpine"
  appDb: 15
  mailroomDb: 11
  courierDb: 12
  persistence: { enabled: false, size: 8Gi, storageClassName: "" }
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 2Gi }

postgresql:
  enabled: true
  image:
    repository: postgis/postgis
    tag: "15-3.3"
  auth:
    username: rapidpro
    password: rapidpro
    database: rapidpro
  service:
    type: ClusterIP
    port: 5432
  persistence: { enabled: true, size: 20Gi, storageClassName: "" }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 2Gi }

# Bundled key under the legacy name `redis` so existing *.enabled toggles work.
redis:
  enabled: true
  service:
    type: ClusterIP
    port: 6379

elasticsearch:
  enabled: true
  image:
    repository: docker.elastic.co/elasticsearch/elasticsearch
    tag: "7.17.9"
  service:
    type: ClusterIP
    port: 9200
  javaOpts: "-Xms512m -Xmx512m"
  persistence: { enabled: true, size: 20Gi, storageClassName: "" }
  resources:
    requests: { cpu: 100m, memory: 1Gi }
    limits: { memory: 2Gi }

# In-cluster S3 for local/dev (and optional staging). Off by default; staging/prod
# use real S3 via the aws* values above.
minio:
  enabled: false
  image:
    repository: minio/minio
    tag: "latest"
  rootUser: "minio"
  rootPassword: "minio12345"
  defaultBucket: "rapidpro"
  service: { port: 9000 }
  persistence: { enabled: false, size: 10Gi, storageClassName: "" }
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }

# Optional Prometheus ServiceMonitor + NetworkPolicy (off by default).
metrics:
  serviceMonitor: { enabled: false }
networkPolicy:
  enabled: false
